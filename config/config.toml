[editor]
tab-width = 4
profile = "helix"
line-numbers = "absolute"
git-branch-symbol = ""
highlight-max-bytes = 8388608 # 0 = no limit
file-tree-show-hidden = false
file-tree-show-ignored = false

[theme]
theme = "ayu"

[keymap.normal]
h = "move_left"
j = "move_down"
k = "move_up"
l = "move_right"
left = "move_left"
down = "move_down"
up = "move_up"
right = "move_right"
home = "line_start"
end = "line_end"
"cmd+home" = "file_start"
"cmd+end" = "file_end"
"cmd+left" = "word_left"
"cmd+right" = "word_right"
"cmd+up" = "move_line_up"
"cmd+down" = "move_line_down"
"cmd+l" = "toggle_line_numbers"
"cmd+b" = "branch_picker"
"cmd+shift+w" = "worktree_menu"
"cmd+shift+n" = "worktree_new"
"cmd+shift+s" = "worktree_switch"
"cmd+shift+d" = "worktree_remove"
"cmd+shift+r" = "worktree_refresh"
"cmd+o" = "open_file_tree"
"alt+left" = "focus_prev_pane"
"alt+right" = "focus_next_pane"
"alt+up" = "expand_selection"
"alt+down" = "shrink_selection"
"alt+x" = "focus_command"
"alt+m" = "merge_mode"
"alt+1" = "toggle_sidebar"
"alt+2" = "focus_editor"
"cmd+y" = "delete_line"
del = "delete_char"
"cmd+backspace" = "delete_word_left"
"cmd+del" = "delete_word_right"
"ctrl+home" = "file_start"
"ctrl+end" = "file_end"
"ctrl+y" = "scroll_up"
"ctrl+e" = "scroll_down"
pgup = "page_up"
pgdn = "page_down"
i = "enter_insert"
":" = "enter_command"
u = "undo"
U = "redo"
"ctrl+c" = "toggle_comment"
"ctrl+r" = "redo"
"ctrl+w" = "window_mode"
"ctrl+a" = "increment_number"
"ctrl+x" = "decrement_number"
tab = "indent"
"shift+tab" = "unindent"
"cmd+a" = "select_all"
"cmd+g" = "goto_line_prompt"
"f3" = "git_next_change"
"shift+f3" = "git_prev_change"
w = "word_forward"
b = "word_backward"
e = "word_end"
W = "word_forward_long"
B = "word_backward_long"
E = "word_end_long"
g = "goto_mode"
G = "goto_line"
f = "find_char"
F = "find_char_backward"
t = "till_char"
T = "till_char_backward"
d = "delete"
c = "change"
y = "yank"
p = "paste"
P = "paste_before"
R = "replace_with_yank"
o = "open_below"
O = "open_above"
a = "append"
A = "append_line_end"
I = "insert_line_start"
r = "replace_char"
J = "join_lines"
v = "toggle_select"
x = "extend_line"
";" = "collapse_selection"
"alt+;" = "flip_selection"
s = "select_regex"
S = "split_selection_regex"
"alt+s" = "split_selection_lines"
"&" = "align_selections"
")" = "cycle_selection_next"
"(" = "cycle_selection_prev"
"," = "keep_primary_selection"
"alt+," = "remove_primary_selection"
C = "duplicate_cursor_next"
"alt+c" = "duplicate_cursor_prev"
"alt+)" = "cycle_selection_contents_next"
"alt+(" = "cycle_selection_contents_prev"
"~" = "toggle_case"
"`" = "lowercase"
"alt+`" = "uppercase"
"%" = "select_all"
">" = "indent"
"<" = "unindent"
space = "space_mode"
m = "match_mode"
z = "view_mode"
n = "search_next"
N = "search_prev"
"/" = "search_forward"
"?" = "search_backward"
"*" = "search_selection"
"cmd+f" = "search_fuzzy"
"cmd+e" = "search_regex"
"shift+enter" = "insert_line_above"
"=" = "terminal_zoom_in"
"alt+o" = "expand_selection"
"alt+i" = "shrink_selection"
"alt+shift+up" = "expand_selection"
"alt+shift+down" = "shrink_selection"
"cmd+s" = "save"
M = "merge_mode"

